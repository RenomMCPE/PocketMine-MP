name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHPUnit & phar build (PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]
    steps:
      - uses: actions/checkout@v7

      - name: Install PocketMine PHP binary (pmmp/PHP-Binaries)
        run: |
          curl -fsSL -o php.tar.gz "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-${{ matrix.php }}-latest/PHP-${{ matrix.php }}-Linux-x86_64-PM5.tar.gz"
          mkdir bin
          tar -xzf php.tar.gz -C bin
          PHP_BIN="$(find bin -type f -name php | head -1)"
          if [ -z "$PHP_BIN" ]; then
            echo "PHP binary not found in archive" && exit 1
          fi
          chmod +x "$PHP_BIN"
          echo "$(cd "$(dirname "$PHP_BIN")" && pwd)" >> "$GITHUB_PATH"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --ignore-platform-req=ext-webrtc

      - name: Run PHPUnit tests
        run: php vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit

      - name: Build server phar
        run: |
          composer install --no-dev --prefer-dist --no-interaction --ignore-platform-req=ext-webrtc
          php -d phar.readonly=0 build/server-phar.php --out=PocketMine-MP.phar
